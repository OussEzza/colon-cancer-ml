services:

  training:

    build:
      context: ./training

    container_name:
      colon-cancer-training

    volumes:
      - ./model:/model

    command: python train.py

  app:

    build:
      context: ./app

    container_name:
      colon-cancer-app

    ports:
      - "8000:8000"

    volumes:
      - ./model:/model

    depends_on:
      - training